services:
  api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - rag-data:/app/data/processed
      - vector-data:/app/data/vector_db
    expose:
      - "8000"
    mem_limit: 6g

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  rag-data:
  vector-data:
  caddy-data:
  caddy-config:

